<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Todo App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Main app container -->
    <div class="app" id="app">
      <h1>My Todo List</h1>

      <!-- Tab bar -->
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="list">Todo List</button>
        <button class="tab-btn" data-tab="kanban">Kanban Board</button>
      </div>

      <!-- ===== TODO LIST VIEW ===== -->
      <div id="view-list" class="tab-view">

        <!-- Input area -->
        <div class="input-row">
          <input
            type="text"
            id="todo-input"
            placeholder="What needs to be done?"
            autocomplete="off"
          />
          <button id="add-btn">Add</button>
        </div>

        <!-- Status line -->
        <p class="status" id="status"></p>

        <!-- Todo list -->
        <ul id="todo-list"></ul>

        <!-- Empty state -->
        <p class="empty-msg" id="empty-msg">No todos yet — add one above!</p>
      </div>

      <!-- ===== KANBAN BOARD VIEW ===== -->
      <div id="view-kanban" class="tab-view hidden">
        <div class="kanban-board">

          <div class="kanban-col">
            <h2 class="kanban-col-title">Pending</h2>
            <div class="kanban-cards" id="cards-pending">
              <p class="kanban-empty">Nothing here yet</p>
            </div>
          </div>

          <div class="kanban-col">
            <h2 class="kanban-col-title">In Progress</h2>
            <div class="kanban-cards" id="cards-inprogress">
              <p class="kanban-empty">Nothing here yet</p>
            </div>
          </div>

          <div class="kanban-col">
            <h2 class="kanban-col-title">Completed</h2>
            <div class="kanban-cards" id="cards-completed">
              <p class="kanban-empty">Nothing here yet</p>
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- ===== DETAIL MODAL ===== -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal" id="modal">

        <!-- Close button -->
        <button id="modal-close" class="modal-close" title="Close">✕</button>

        <!-- Editable title -->
        <input
          id="modal-title"
          class="modal-title-input"
          type="text"
          placeholder="Todo title"
        />

        <!-- Details / notes -->
        <label class="modal-label">Details</label>
        <textarea
          id="modal-details"
          class="modal-details"
          placeholder="Add notes or details..."
        ></textarea>

        <!-- Subtasks -->
        <div class="subtasks-section">
          <h3 class="modal-label">Subtasks</h3>
          <ul id="modal-subtasks"></ul>
          <div class="subtask-input-row">
            <input
              id="subtask-input"
              type="text"
              placeholder="Add a subtask..."
              autocomplete="off"
            />
            <button id="subtask-add-btn">Add</button>
          </div>
        </div>

      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
